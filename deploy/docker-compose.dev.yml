name: bimik-core-v2-dev

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bimik_core_v2
      POSTGRES_USER: bimik
      POSTGRES_PASSWORD: bimik_dev_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - bimik_core_v2_pg18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bimik -d bimik_core_v2"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bimik_core_v2_pg18_data:
