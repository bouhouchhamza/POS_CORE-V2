name: Release gate

on:
  push:
  pull_request:

jobs:
  verification:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: bimik_core_v2_test
          POSTGRES_USER: bimik_test
          POSTGRES_PASSWORD: bimik_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bimik_test -d bimik_core_v2_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://bimik_test:bimik_test_only@127.0.0.1:5432/bimik_core_v2_test
      TEST_DATABASE_URL: postgresql://bimik_test:bimik_test_only@127.0.0.1:5432/bimik_core_v2_test
      REQUIRE_POSTGRES_INTEGRATION: "true"
      JWT_SECRET: integration-test-secret-at-least-32-characters
      CORS_ORIGINS: http://127.0.0.1:5173
      UPLOAD_DIR: ../../uploads-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run test -w @bimik/validation
      - run: npm run test:postgres -w @bimik/api
      - run: npm run test -w @bimik/api
      - run: npm run lint -w @bimik/web
      - run: npm run typecheck -w @bimik/web
      - run: npm run build -w @bimik/api
      - run: npm run build -w @bimik/web -- --outDir dist-ci
      - run: npm audit --omit=dev
